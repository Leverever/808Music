services:
  sqlserver:
    image: 808music-sqlserver:local
    build:
      context: ..
      dockerfile: backend/docker/sqlserver/Dockerfile
    container_name: 808music-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-808Music_Docker_SQL_2026!}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/808music/scripts/sqlcmd.sh -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  database-init:
    image: 808music-sqlserver:local
    container_name: 808music-database-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-808Music_Docker_SQL_2026!}
      DATABASE_NAME: ${DATABASE_NAME:-naziv_db_2}
      SQLSERVER_HOST: sqlserver
    entrypoint: ["/opt/808music/scripts/initialize-database.sh"]
    restart: "no"

  backend:
    image: 808music-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 808music-backend
    depends_on:
      database-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__db1: "Server=sqlserver,1433;Database=${DATABASE_NAME:-naziv_db_2};User ID=sa;Password=${MSSQL_SA_PASSWORD:-808Music_Docker_SQL_2026!};MultipleActiveResultSets=true;TrustServerCertificate=True"
      ConnectionStrings__Redis: redis:6379
      Database__MigrateOnStartup: "true"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: 808music
      RabbitMq__Password: 808music_dev_password
      S3__ServiceUrl: http://minio:9000
      S3__PublicUrl: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      BackendUrl: http://localhost:8080
      LegacyTrackMigration__LegacyTrackRoot: /app/TrackFiles
    ports:
      - "${BACKEND_PORT:-7000}:8080"
    volumes:
      - backend-wwwroot:/app/wwwroot
      - backend-track-files:/app/TrackFiles

  rabbitmq:
    image: rabbitmq:3-management
    container_name: 808music-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 808music
      RABBITMQ_DEFAULT_PASS: 808music_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: 808music-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-worker:
    profiles:
      - cpu
    build:
      context: ../ml-service
    container_name: 808music-ml-worker
    depends_on:
      - rabbitmq
      - minio
      - backend
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: 808music
      RABBITMQ_PASSWORD: 808music_dev_password
      RABBITMQ_EXCHANGE: 808music
      RABBITMQ_QUEUE: ml.stems.separation
      RABBITMQ_ROUTING_KEY: ml.stems.separate
      RABBITMQ_HEARTBEAT: 0
      DEMUCS_DEVICE: cpu
      DEMUCS_OUTPUT_FORMAT: mp3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: 808music
      S3_SECRET_KEY: 808music_dev_password
      S3_BUCKET: 808music-media
      S3_REGION: eu-central-1
      BACKEND_BASE_URL: http://backend:8080
      BACKEND_INTERNAL_API_KEY: dev-internal-api-key
      WORKSPACE_ROOT: /work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-worker-work:/work

  ml-audio-worker:
    build:
      context: ../ml-service
    container_name: 808music-ml-audio-worker
    depends_on:
      - rabbitmq
      - minio
      - backend
    environment:
      WORKER_JOB_TYPE: audio-analysis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: 808music
      RABBITMQ_PASSWORD: 808music_dev_password
      RABBITMQ_EXCHANGE: 808music
      RABBITMQ_QUEUE: ml.audio.analysis
      RABBITMQ_ROUTING_KEY: ml.audio.analyze
      RABBITMQ_HEARTBEAT: 0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: 808music
      S3_SECRET_KEY: 808music_dev_password
      S3_BUCKET: 808music-media
      S3_REGION: eu-central-1
      BACKEND_BASE_URL: http://backend:8080
      BACKEND_INTERNAL_API_KEY: dev-internal-api-key
      WORKSPACE_ROOT: /work
      ESSENTIA_MODEL_DIR: /models/essentia
      ESSENTIA_AUTO_DOWNLOAD_MODELS: "true"
      ESSENTIA_DISCOGS_TAGS_ENABLED: "true"
      ESSENTIA_DISCOGS_TOP_K: "8"
      ESSENTIA_DISCOGS_MIN_SCORE: "0.15"
      ESSENTIA_CUSTOM_HEAD_MANIFEST: /models/essentia/custom-heads.json
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-worker-work:/work
      - ml-worker-models:/models

  ml-clustering-worker:
    build:
      context: ../ml-service
    container_name: 808music-ml-clustering-worker
    depends_on:
      - rabbitmq
      - backend
    environment:
      WORKER_JOB_TYPE: audio-clustering
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: 808music
      RABBITMQ_PASSWORD: 808music_dev_password
      RABBITMQ_EXCHANGE: 808music
      RABBITMQ_QUEUE: ml.audio.clustering
      RABBITMQ_ROUTING_KEY: ml.audio.cluster
      RABBITMQ_HEARTBEAT: 0
      BACKEND_BASE_URL: http://backend:8080
      BACKEND_INTERNAL_API_KEY: dev-internal-api-key
      WORKSPACE_ROOT: /work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-worker-work:/work

  ml-worker-gpu:
    build:
      context: ../ml-service
      dockerfile: Dockerfile.gpu
    container_name: 808music-ml-worker-gpu
    depends_on:
      - rabbitmq
      - minio
      - backend
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: 808music
      RABBITMQ_PASSWORD: 808music_dev_password
      RABBITMQ_EXCHANGE: 808music
      RABBITMQ_QUEUE: ml.stems.separation
      RABBITMQ_ROUTING_KEY: ml.stems.separate
      RABBITMQ_HEARTBEAT: 0
      DEMUCS_DEVICE: cuda
      DEMUCS_OUTPUT_FORMAT: mp3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: 808music
      S3_SECRET_KEY: 808music_dev_password
      S3_BUCKET: 808music-media
      S3_REGION: eu-central-1
      BACKEND_BASE_URL: http://backend:8080
      BACKEND_INTERNAL_API_KEY: dev-internal-api-key
      WORKSPACE_ROOT: /work
      TORCH_HOME: /models/torch
      XDG_CACHE_HOME: /models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-worker-work:/work
      - ml-worker-models:/models

  minio:
    image: quay.io/minio/minio:latest
    container_name: 808music-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: 808music
      MINIO_ROOT_PASSWORD: 808music_dev_password
      MINIO_REGION_NAME: eu-central-1
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 808music 808music_dev_password; do sleep 2; done;
      mc mb --ignore-existing local/808music-media;
      exit 0;
      "

volumes:
  sqlserver-data:
  backend-wwwroot:
  backend-track-files:
  minio-data:
  rabbitmq-data:
  ml-worker-work:
  ml-worker-models:
