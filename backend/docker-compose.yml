services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: 808music-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: 808music
      RABBITMQ_DEFAULT_PASS: 808music_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: 808music-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-worker:
    profiles:
      - cpu
    build:
      context: ../ml-service
    container_name: 808music-ml-worker
    depends_on:
      - rabbitmq
      - minio
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: 808music
      RABBITMQ_PASSWORD: 808music_dev_password
      RABBITMQ_EXCHANGE: 808music
      RABBITMQ_QUEUE: ml.stems.separation
      RABBITMQ_ROUTING_KEY: ml.stems.separate
      RABBITMQ_HEARTBEAT: 0
      DEMUCS_DEVICE: cpu
      DEMUCS_OUTPUT_FORMAT: mp3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: 808music
      S3_SECRET_KEY: 808music_dev_password
      S3_BUCKET: 808music-media
      S3_REGION: eu-central-1
      BACKEND_BASE_URL: http://host.docker.internal:7000
      BACKEND_INTERNAL_API_KEY: dev-internal-api-key
      WORKSPACE_ROOT: /work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-worker-work:/work

  ml-audio-worker:
    build:
      context: ../ml-service
    container_name: 808music-ml-audio-worker
    depends_on:
      - rabbitmq
      - minio
    environment:
      WORKER_JOB_TYPE: audio-analysis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: 808music
      RABBITMQ_PASSWORD: 808music_dev_password
      RABBITMQ_EXCHANGE: 808music
      RABBITMQ_QUEUE: ml.audio.analysis
      RABBITMQ_ROUTING_KEY: ml.audio.analyze
      RABBITMQ_HEARTBEAT: 0
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: 808music
      S3_SECRET_KEY: 808music_dev_password
      S3_BUCKET: 808music-media
      S3_REGION: eu-central-1
      BACKEND_BASE_URL: http://host.docker.internal:7000
      BACKEND_INTERNAL_API_KEY: dev-internal-api-key
      WORKSPACE_ROOT: /work
      ESSENTIA_MODEL_DIR: /models/essentia
      ESSENTIA_AUTO_DOWNLOAD_MODELS: "true"
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-worker-work:/work
      - ml-worker-models:/models

  ml-clustering-worker:
    build:
      context: ../ml-service
    container_name: 808music-ml-clustering-worker
    depends_on:
      - rabbitmq
    environment:
      WORKER_JOB_TYPE: audio-clustering
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: 808music
      RABBITMQ_PASSWORD: 808music_dev_password
      RABBITMQ_EXCHANGE: 808music
      RABBITMQ_QUEUE: ml.audio.clustering
      RABBITMQ_ROUTING_KEY: ml.audio.cluster
      RABBITMQ_HEARTBEAT: 0
      BACKEND_BASE_URL: http://host.docker.internal:7000
      BACKEND_INTERNAL_API_KEY: dev-internal-api-key
      WORKSPACE_ROOT: /work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-worker-work:/work

  ml-worker-gpu:
    build:
      context: ../ml-service
      dockerfile: Dockerfile.gpu
    container_name: 808music-ml-worker-gpu
    depends_on:
      - rabbitmq
      - minio
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: 808music
      RABBITMQ_PASSWORD: 808music_dev_password
      RABBITMQ_EXCHANGE: 808music
      RABBITMQ_QUEUE: ml.stems.separation
      RABBITMQ_ROUTING_KEY: ml.stems.separate
      RABBITMQ_HEARTBEAT: 0
      DEMUCS_DEVICE: cuda
      DEMUCS_OUTPUT_FORMAT: mp3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: 808music
      S3_SECRET_KEY: 808music_dev_password
      S3_BUCKET: 808music-media
      S3_REGION: eu-central-1
      BACKEND_BASE_URL: http://host.docker.internal:7000
      BACKEND_INTERNAL_API_KEY: dev-internal-api-key
      WORKSPACE_ROOT: /work
      TORCH_HOME: /models/torch
      XDG_CACHE_HOME: /models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ml-worker-work:/work
      - ml-worker-models:/models

  minio:
    image: quay.io/minio/minio:latest
    container_name: 808music-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: 808music
      MINIO_ROOT_PASSWORD: 808music_dev_password
      MINIO_REGION_NAME: eu-central-1
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 808music 808music_dev_password; do sleep 2; done;
      mc mb --ignore-existing local/808music-media;
      exit 0;
      "

volumes:
  minio-data:
  rabbitmq-data:
  ml-worker-work:
  ml-worker-models:
