services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: 808music-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: 808music
      MINIO_ROOT_PASSWORD: 808music_dev_password
      MINIO_REGION_NAME: eu-central-1
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 808music 808music_dev_password; do sleep 2; done;
      mc mb --ignore-existing local/808music-media;
      exit 0;
      "

volumes:
  minio-data: