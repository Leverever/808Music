<section class="auth-page">
  <article class="auth-card auth-card--compact">
    <header class="auth-card-header">
      <span class="auth-eyebrow">Account security</span>
      <h1>Two-factor verification</h1>
      <p>An additional verification step protects your account when it is enabled.</p>
    </header>

    <div class="auth-message auth-message--info">
      There is no active two-factor challenge for this session.
    </div>

    <div class="auth-actions">
      <a mat-stroked-button class="auth-secondary" routerLink="/auth/login">Back to sign in</a>
    </div>
  </article>
</section>
