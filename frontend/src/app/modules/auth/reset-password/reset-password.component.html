<section class="auth-page">
  <article class="auth-card auth-card--compact">
    @if (!sentRequest) {
      <header class="auth-card-header">
        <span class="auth-eyebrow">Secure your account</span>
        <h1>Choose a new password</h1>
        <p>Use at least eight characters with uppercase, lowercase, a number and a special character.</p>
      </header>

      <form class="auth-form" (ngSubmit)="resetPassword()">
        <label class="auth-field" for="password">
          <span>New password</span>
          <input [(ngModel)]="resetRequest.password" id="password" name="password" required type="password"
                 autocomplete="new-password" placeholder="New password" (input)="validatePassword()">
        </label>

        <pass-strength-meter [password]="resetRequest.password"></pass-strength-meter>

        <label class="auth-field" for="repeatPassword">
          <span>Repeat new password</span>
          <input [(ngModel)]="repeatPassword" id="repeatPassword" name="repeatPassword" required type="password"
                 autocomplete="new-password" placeholder="Repeat new password" (input)="validateIfSamePassword()">
        </label>

        <div *ngIf="errorMessage" class="auth-message auth-message--error" role="alert">
          {{ errorMessage }}
        </div>

        <div class="auth-actions">
          <a mat-stroked-button class="auth-secondary" routerLink="/">Back home</a>
          <button mat-flat-button type="submit" class="auth-primary" [disabled]="checkButton()">
            Change password
          </button>
        </div>
      </form>
    } @else {
      <div class="auth-success">
        <span class="auth-eyebrow">Password updated</span>
        <h2>{{ successText }}</h2>
        <p>You can now sign in with your new password.</p>
        <a mat-stroked-button class="auth-secondary" routerLink="../login">Go to sign in</a>
      </div>
    }
  </article>
</section>
