<div class="msg-list">
  @for (m of messages; track m.id; let isLast = $last)
  {
    <div class="message-row"
         [class.outgoing-row]="m.senderId === userId"
         [class.incoming-row]="m.senderId !== userId">
      <app-message-card [message]="m" [showStatusByDefault]="isLast"></app-message-card>
    </div>
  }
</div>
