<main class="followage-page" [style.--profile-accent]="selectedColor" [@pageAnimation]>
  <header class="followage-header">
    <button type="button" class="go-back-button" aria-label="Go back" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div>
      <span class="page-eyebrow">Community</span>
      <h1>Followers</h1>
      <p>{{ followers.length }} {{ followers.length === 1 ? 'listener' : 'listeners' }}</p>
    </div>
  </header>

  <section class="followage-grid" *ngIf="followers.length; else noFollowers" aria-label="Followers">
    <button type="button" class="person-card" *ngFor="let user of followers" (click)="openProfile(user.id)">
      <span
        class="followage-pfp"
        [style.background-image]="'url(' + MyConfig.mediaUrl(user.profilePicture, 'Images/ProfilePictures/placeholder.png') + ')'">
      </span>
      <span class="person-copy">
        <strong>{{ user.username }}</strong>
        <span>Listener profile</span>
      </span>
      <mat-icon>chevron_right</mat-icon>
    </button>
  </section>

  <ng-template #noFollowers>
    <section class="empty-followage">
      <mat-icon>group</mat-icon>
      <h2>No followers yet</h2>
      <p>When listeners follow this profile, they will appear here.</p>
    </section>
  </ng-template>
</main>
