<section class="liquid-sheet recommendation-reason-sheet">
  <header class="liquid-sheet-header">
    <div>
      <span class="liquid-sheet-eyebrow">Recommended for you</span>
      <h3>Why this track?</h3>
    </div>
    <button type="button" mat-icon-button class="liquid-sheet-close"
            (click)="dismiss()" aria-label="Close recommendation reason">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="reason-content">
    <span class="reason-icon" aria-hidden="true">
      <mat-icon>auto_awesome</mat-icon>
    </span>
    <p>{{ data.reason }}</p>
  </div>

  <footer class="liquid-sheet-actions">
    <button type="button" mat-flat-button class="liquid-sheet-primary" (click)="dismiss()">
      Got it
    </button>
  </footer>
</section>
