<section class="artist-storefront">
  <header>
    <span>Official merchandise</span>
    <h2>Shop the artist</h2>
    <p *ngIf="Products.length">{{ Products.length }} product{{ Products.length === 1 ? '' : 's' }}</p>
  </header>

  <div class="artist-storefront__state" *ngIf="loading">
    <mat-spinner diameter="38"></mat-spinner>
    <p>Loading merchandise…</p>
  </div>

  <div class="artist-storefront__state" *ngIf="!loading && errorMessage">
    <mat-icon>storefront</mat-icon>
    <p>{{ errorMessage }}</p>
  </div>

  <div class="artist-storefront__state" *ngIf="!loading && !errorMessage && !Products.length">
    <mat-icon>inventory_2</mat-icon>
    <h3>No merchandise yet</h3>
    <p>New products will appear here when they are released.</p>
  </div>

  <div class="artist-storefront__grid" *ngIf="!loading && Products.length">
    <app-store-product-card *ngFor="let product of Products" [product]="product"></app-store-product-card>
  </div>
</section>
