<section class="order-confirmation">
  <div class="order-confirmation__icon"><mat-icon>check</mat-icon></div>
  <span>Payment received</span>
  <h2>Order confirmed</h2>
  <p>We sent the confirmation and order details to your email.</p>
  <strong class="order-confirmation__code" *ngIf="orderCode">{{ orderCode }}</strong>
  <div class="order-confirmation__actions">
    <button mat-button type="button" (click)="onBackToHome()">Back home</button>
    <button mat-button type="button" class="primary" (click)="onBackToStore()">Continue shopping</button>
  </div>
</section>
