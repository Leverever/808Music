<main class="storefront-catalog">
  <header class="catalog-header">
    <div class="catalog-title">
      <span>Browse the shop</span>
      <h1>{{ categoryLabel }}</h1>
      <p>{{ totalResults }} product{{ totalResults === 1 ? '' : 's' }}</p>
    </div>

    <div class="catalog-toolbar catalog-toolbar--compact">
      <a class="catalog-home" routerLink="/listener/store-home"><mat-icon>arrow_back</mat-icon><span>Shop home</span></a>
      <div class="catalog-toolbar-spacer"></div>
      <app-wishlist></app-wishlist>
      <app-shopping-cart></app-shopping-cart>
    </div>

    <div class="catalog-controls">
      <label>
        <mat-icon>category</mat-icon>
        <select [(ngModel)]="productType" (ngModelChange)="changeCategory()" aria-label="Product category">
          <option *ngFor="let type of productTypes" [ngValue]="type.value">{{ type.label }}</option>
        </select>
      </label>
      <label>
        <mat-icon>swap_vert</mat-icon>
        <select [(ngModel)]="selectedSortOption" (ngModelChange)="changeSortOrder()" aria-label="Sort products">
          <option *ngFor="let option of sortOptions" [value]="option.value">{{ option.label }}</option>
        </select>
      </label>
    </div>
  </header>

  <div class="catalog-state" *ngIf="loading"><mat-spinner diameter="40"></mat-spinner><p>Loading {{ categoryLabel | lowercase }}…</p></div>
  <div class="catalog-state" *ngIf="!loading && noResults"><mat-icon>inventory_2</mat-icon><h2>Nothing here yet</h2><p>Try another category or come back later.</p></div>

  <section class="catalog-grid" *ngIf="!loading && searchResults.length">
    <app-store-product-card *ngFor="let product of searchResults" [product]="product"></app-store-product-card>
  </section>

  <nav class="catalog-pagination" *ngIf="!loading && (currentPage > 1 || searchResults.length === pageSize)" aria-label="Product category pages">
    <button type="button" [disabled]="currentPage <= 1" (click)="changePage(currentPage - 1)"><mat-icon>chevron_left</mat-icon><span>Previous</span></button>
    <span>Page {{ currentPage }}</span>
    <button type="button" [disabled]="searchResults.length < pageSize" (click)="changePage(currentPage + 1)"><span>Next</span><mat-icon>chevron_right</mat-icon></button>
  </nav>
</main>
