<main class="storefront-catalog">
  <header class="catalog-header">
    <div class="catalog-title-row">
      <a class="catalog-back" routerLink="/listener/store-home" aria-label="Back to shop">
        <mat-icon>arrow_back</mat-icon>
      </a>
      <div class="catalog-title">
      <span>808 Shop</span>
      <h1>Search products</h1>
      <p *ngIf="keyword">{{ totalResults }} result{{ totalResults === 1 ? '' : 's' }} for “{{ keyword }}”</p>
      </div>
    </div>

    <div class="catalog-toolbar">
      <form class="catalog-search" (ngSubmit)="searchProducts()">
        <mat-icon>search</mat-icon>
        <input type="search" aria-label="Search products" placeholder="Search products" [formControl]="searchControl" [matAutocomplete]="auto">
        <button type="submit" aria-label="Search"><mat-icon>arrow_forward</mat-icon></button>
      </form>
      <app-wishlist></app-wishlist>
      <app-shopping-cart></app-shopping-cart>
    </div>

    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="viewProduct($event.option.value)">
      <mat-option *ngFor="let product of filteredProducts" [value]="product.slug">
        <img class="autocomplete-product-image" [src]="mediaAddress + product.photoPaths[product.photoPaths.length - 1]" [alt]="product.title">
        {{ product.title }}
      </mat-option>
    </mat-autocomplete>

    <div class="catalog-controls">
      <label>
        <mat-icon>swap_vert</mat-icon>
        <select [(ngModel)]="selectedSortOption" (ngModelChange)="changeSortOrder()" aria-label="Sort products">
          <option *ngFor="let option of sortOptions" [value]="option.value">{{ option.label }}</option>
        </select>
      </label>
    </div>
  </header>

  <div class="catalog-state" *ngIf="loading"><mat-spinner diameter="40"></mat-spinner><p>Finding products…</p></div>
  <div class="catalog-state" *ngIf="!loading && noResults"><mat-icon>search_off</mat-icon><h2>No products found</h2><p>Try another artist, product, or category.</p></div>

  <section class="catalog-grid" *ngIf="!loading && searchResults.length">
    <app-store-product-card *ngFor="let product of searchResults" [product]="product"></app-store-product-card>
  </section>

  <nav class="catalog-pagination" *ngIf="!loading && (currentPage > 1 || searchResults.length === pageSize)" aria-label="Product results pages">
    <button type="button" [disabled]="currentPage <= 1" (click)="changePage(currentPage - 1)"><mat-icon>chevron_left</mat-icon><span>Previous</span></button>
    <span>Page {{ currentPage }}</span>
    <button type="button" [disabled]="searchResults.length < pageSize" (click)="changePage(currentPage + 1)"><span>Next</span><mat-icon>chevron_right</mat-icon></button>
  </nav>
</main>
