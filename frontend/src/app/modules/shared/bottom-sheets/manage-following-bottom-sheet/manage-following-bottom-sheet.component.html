<section class="liquid-sheet following-sheet">
  <header class="liquid-sheet-header">
    <div>
      <span class="liquid-sheet-eyebrow">Artist updates</span>
      <h3>Manage following</h3>
    </div>
    <button type="button" mat-icon-button class="liquid-sheet-close" (click)="dismiss()"
            aria-label="Close manage following">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <p class="sheet-description">Choose who you follow and which artists can send release notifications.</p>

  <div class="following liquid-sheet-scroll">
    @if (following) {
      @for (a of following; track a.id) {
        <div class="following-row liquid-sheet-row">
          <app-artist-small-card [artist]="a" [followManagerMode]="true"
                                 (onRemove)="removeArtist($event)"></app-artist-small-card>
        </div>
      } @empty {
        <div class="liquid-sheet-empty">
          <mat-icon>person_search</mat-icon>
          <strong>No followed artists</strong>
          <span>Artists you follow will appear here.</span>
        </div>
      }
    } @else {
      <div class="following-loading" aria-label="Loading followed artists">
        @for (item of [1, 2, 3]; track item) {
          <div class="loading-row"></div>
        }
      </div>
    }
  </div>

  <footer class="liquid-sheet-actions">
    <button type="button" mat-flat-button class="liquid-sheet-primary" (click)="dismiss()">Done</button>
  </footer>
</section>
