<section class="liquid-sheet send-sheet">
  <header class="liquid-sheet-header">
    <div>
      <span class="liquid-sheet-eyebrow">Track action</span>
      <h3>Send to</h3>
    </div>
    <button type="button" mat-icon-button class="liquid-sheet-close"
            (click)="dismiss()" aria-label="Close send sheet">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="search">
    <app-search-bar [placeholder]="'Find chats'" [autoSearch]="true" (onSearchChange)="findChats($event)"></app-search-bar>
  </div>

  <div class="msg-cont">
    <label>Message content</label>
    <mat-form-field>
      <input matInput [formControl]="message" placeholder="Tell them why you shared">
    </mat-form-field>
  </div>

  <div class="following liquid-sheet-scroll">
    @let filteredChats = getChats();
    @if(filteredChats.length > 0)
    {
      @for (a of filteredChats; track a.id) {
        <div class="liquid-sheet-row chat-row"
             role="button"
             tabindex="0"
             [attr.aria-pressed]="checkIfSelected(a)"
             [class.selected]="checkIfSelected(a)"
             (click)="toggleChat(a)"
             (keydown.enter)="toggleChat(a)"
             (keydown.space)="$event.preventDefault(); toggleChat(a)">
          <div class="pfp" [ngStyle]="{'background-image': 'url('+MyConfig.api_address + '/media'+a.chatterPfp+')'}"></div>
          <div class="chat-copy">
            <strong>{{ a.chatter }}</strong>
          </div>
          <mat-checkbox (change)="checkChat($event, a)" [checked]="checkIfSelected(a)"
                        (click)="$event.stopPropagation()"
                        [attr.aria-label]="'Send to ' + a.chatter"></mat-checkbox>
        </div>
      }
    } @else {
      <div class="liquid-sheet-empty">
        <mat-icon>report</mat-icon>
        <strong>No matching chats</strong>
        <span>Try a different search.</span>
      </div>
    }
  </div>

  <footer class="actions liquid-sheet-actions">
    <button type="button" mat-stroked-button (click)="dismiss()">Cancel</button>
    <button type="button" mat-flat-button class="liquid-sheet-primary"
            (click)="sendMessages()" [disabled]="chatsToSendTo.length < 1">
      <mat-icon>send</mat-icon>
      Send
    </button>
  </footer>
</section>
