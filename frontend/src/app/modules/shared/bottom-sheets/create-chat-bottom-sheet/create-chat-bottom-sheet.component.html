<section class="liquid-sheet create-chat-sheet">
  <header class="liquid-sheet-header">
    <div>
      <span class="liquid-sheet-eyebrow">Messages</span>
      <h3>Start a chat</h3>
    </div>
    <button type="button" mat-icon-button class="liquid-sheet-close" (click)="dismiss()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="chat-search">
    <app-search-bar
      [placeholder]="'Find users'"
      [autoSearch]="true"
      (onSearchChange)="findUsers($event)">
    </app-search-bar>
  </div>

  <div class="liquid-sheet-scroll user-results">
    @if (users.length > 0) {
      @for (user of users; track user.id) {
        <button type="button" class="liquid-sheet-row user-result" (click)="createChat(user)">
          <span
            class="user-avatar"
            [class.user-avatar--empty]="!user.profilePicture"
            [style.background-image]="user.profilePicture ? 'url(' + mediaAddress + user.profilePicture + ')' : null">
            @if (!user.profilePicture) {
              <mat-icon>person</mat-icon>
            }
          </span>
          <span class="user-copy">
            <strong>{{ user.username }}</strong>
            <span>Start a new conversation</span>
          </span>
          <mat-icon>chat_bubble</mat-icon>
        </button>
      }
    } @else {
      <div class="liquid-sheet-empty">
        <mat-icon>person_search</mat-icon>
        <strong>No users found</strong>
        <span>Try a different username.</span>
      </div>
    }
  </div>
</section>
