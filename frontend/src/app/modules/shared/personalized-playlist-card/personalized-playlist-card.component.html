<mat-card appearance="outlined" class="album-mat-card"
          [matTooltip]="playlist.name"
          matTooltipTouchGestures="off"
          matTooltipPosition="above"
          matTooltipShowDelay="500"
          matTooltipHideDelay="250"
          (mouseover)="showPlayButton()"
          (mouseleave)="hidePlayButton()"
          (click)="openPlaylist()">
  <div class="playlist-cover" matCardImage role="img"
       [attr.aria-label]="playlist.name"
       [style.background-image]="'url(&quot;' + imageUrl + '&quot;)'">
    <div class="ai-generated-badge" matTooltip="AI-generated playlist" matTooltipTouchGestures="off"
         aria-label="AI-generated playlist">
      <mat-icon>auto_awesome</mat-icon>
      <span>AI</span>
    </div>
  </div>

  <button mat-fab class="play-button"
          [attr.aria-label]="(playingState && isPlayingThisPlaylist() ? 'Pause ' : 'Play ') + playlist.name"
          (click)="handlePlayClick($event)"
          [ngStyle]="playingState && isPlayingThisPlaylist() ? pauseButtonStyle : playButtonStyle">
    <mat-icon>{{ playingState && isPlayingThisPlaylist() ? 'pause' : 'play_arrow' }}</mat-icon>
  </button>

  <mat-card-header>
    <mat-card-title class="album-mat-card-title hide-overflow">{{ getTitle() }}</mat-card-title>
  </mat-card-header>
  <mat-card-content class="album-mat-card-subtitle hide-overflow">{{ playlist.description }}</mat-card-content>
  <mat-card-content class="album-mat-card-subtitle italic hide-overflow">
    {{ playlist.trackCount }} tracks &bull; {{ playlist.playlistDate | date }}
  </mat-card-content>
  <mat-card-content></mat-card-content>
</mat-card>
