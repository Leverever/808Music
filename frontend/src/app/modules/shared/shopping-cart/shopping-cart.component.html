<div class="shopping-cart">
  <button type="button" class="store-utility-button" aria-label="Open shopping cart" (click)="toggleCart()">
    <mat-icon>shopping_bag</mat-icon>
    <span class="item-count" *ngIf="(cart.count$ | async) as count">{{ count > 99 ? '99+' : count }}</span>
  </button>

  <button *ngIf="isCartVisible" type="button" class="cart-backdrop" aria-label="Close shopping cart" (click)="close()"></button>
  <aside *ngIf="isCartVisible" class="cart-panel" role="dialog" aria-modal="true" aria-labelledby="cart-title">
    <header class="cart-panel__header">
      <div><span>Your bag</span><h2 id="cart-title">Ready to order?</h2></div>
      <button type="button" class="cart-close" aria-label="Close cart" (click)="close()"><mat-icon>close</mat-icon></button>
    </header>

    <div class="cart-panel__items" *ngIf="(cart.items$ | async) as items">
      <div class="cart-empty" *ngIf="!items.length">
        <mat-icon>shopping_bag</mat-icon>
        <strong>Your bag is empty</strong>
        <span>Products you add will be ready here.</span>
      </div>

      <article class="cart-item" *ngFor="let item of items">
        <img [src]="item.productPhoto ? mediaAddress + item.productPhoto : 'assets/icons/pattern.svg'" [alt]="item.productTitle">
        <div class="cart-item__details">
          <h3>{{ item.productTitle }}</h3>
          <div class="quantity-control" aria-label="Product quantity">
            <button type="button" [disabled]="item.quantity <= 1" (click)="updateQuantity(item.productId, item.quantity - 1)" aria-label="Decrease quantity"><mat-icon>remove</mat-icon></button>
            <span>{{ item.quantity }}</span>
            <button type="button" (click)="updateQuantity(item.productId, item.quantity + 1)" aria-label="Increase quantity"><mat-icon>add</mat-icon></button>
          </div>
        </div>
        <div class="cart-item__end">
          <button type="button" aria-label="Remove item" (click)="removeItem(item.productId)"><mat-icon>close</mat-icon></button>
          <strong>{{ item.totalPrice | currency:'EUR':'symbol':'1.2-2' }}</strong>
        </div>
      </article>
    </div>

    <footer class="cart-panel__footer" *ngIf="(cart.items$ | async)?.length">
      <div><span>Total</span><strong>{{ cart.total$ | async | currency:'EUR':'symbol':'1.2-2' }}</strong></div>
      <button type="button" (click)="proceedToCheckout()"><span>Checkout</span><mat-icon>arrow_forward</mat-icon></button>
    </footer>
  </aside>
</div>
