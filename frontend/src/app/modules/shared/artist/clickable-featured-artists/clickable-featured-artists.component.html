<div class="artists-viewport" [class.scroll-when-overflow]="scrollWhenOverflow">
  <div class="clickable-artists"
       [appOverflowMarquee]="scrollWhenOverflow"
       (contextmenu)="handleRightClick($event)">
    @for (artist of artists; track artist.id; let i = $index) {
      <span *ngIf="i != 0" class="artist-separator">{{ separator }}</span>
      <span class="clickable-artist" (click)="emitArtist(artist)">{{ artist.name }}</span>
    }
  </div>
</div>
