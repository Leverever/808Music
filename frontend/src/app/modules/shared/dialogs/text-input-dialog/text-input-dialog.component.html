<section class="settings-dialog text-dialog">
  <header class="dialog-header">
    <span>{{ 'SETTINGS.DIALOGS.SecurityEyebrow' | translate }}</span>
    <h2 mat-dialog-title>{{ data.title }}</h2>
    <p>{{ data.content }}</p>
  </header>

  <mat-dialog-content>
    <mat-form-field class="dialog-input" appearance="outline" subscriptSizing="dynamic">
      <mat-label>{{ data.inputLabel }}</mat-label>
      <mat-icon matIconPrefix>lock</mat-icon>
      <input matInput [formControl]="inputValue" [placeholder]="data.placeholder"
             [type]="data.type" name="inputValue">
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button type="button" mat-button (click)="closeDialog(false)">{{ 'SETTINGS.DIALOGS.Cancel' | translate }}</button>
    <button type="button" mat-flat-button class="dialog-primary" (click)="closeDialog(true)">
      {{ 'SETTINGS.DIALOGS.Confirm' | translate }}
    </button>
  </mat-dialog-actions>
</section>
