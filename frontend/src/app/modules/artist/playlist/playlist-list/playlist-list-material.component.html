<div class="base-page flex-page">
  <div class="select-page">
    @if (dailyPlaylists.length > 0) {
      <section class="daily-playlists-section">
        <div class="title">
          <h1 class="title-playlist">Made for you</h1>
          <p>Personalized mixes refreshed every day</p>
        </div>

        <div class="daily-playlist-grid">
          @for (playlist of dailyPlaylists; track playlist.id) {
            <app-personalized-playlist-card
              [playlist]="playlist"
              [imageUrl]="mediaUrl(playlist.coverPath)"
              (onClick)="openDailyPlaylist($event)"
              (onPlayClick)="startDailyPlaylist($event)">
            </app-personalized-playlist-card>
          }
        </div>
      </section>
    }

    <div class="title">
      <h1 class="title-playlist">Your playlists</h1>
    </div>

    <div class="flex-controls">
      <mat-card class="add-playlist" appearance="outlined" (click)="createPlaylist()">
        <mat-card-header>
          <mat-card-title-group>
            <mat-card-title>New Playlist</mat-card-title>
            <mat-icon>add_circle</mat-icon>
          </mat-card-title-group>
        </mat-card-header>
        <mat-card-content></mat-card-content>
      </mat-card>
    </div>

    <div class="flex-container">
      <div class="row" *ngFor="let playlist of playlists || []">
        <app-playlist-card matTooltip="{{ playlist.title }}" matTooltipPosition="below" [title]="playlist.title"
                           [imageUrl]="MyConfig.media_address + playlist.coverPath"
                           [username]="playlist.ownerUsername"
                           [id]="playlist.id"
                           [hasControls]="false"
                           (onDelete)="deletePlaylist(playlist.id)"
                           (onEdit)="editPlaylist(playlist.id)"
                           (onClick)="openPlaylist(playlist.id)"
                           (onPlayClick)="startPlaylist($event, playlist)">
        </app-playlist-card>
      </div>
    </div>
  </div>
</div>
