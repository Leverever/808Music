<div class="public-app-layout">
  <div class="public-orb public-orb--primary" aria-hidden="true"></div>
  <div class="public-orb public-orb--secondary" aria-hidden="true"></div>

  <header class="public-nav-shell">
    <a class="public-brand" routerLink="/public/home" aria-label="808 Music home">
      <img src="/images/logo_qr.png" alt="">
      <span>
        <strong>808</strong>
        <small>Music</small>
      </span>
    </a>

    <nav class="public-tabs" aria-label="Public pages">
      <a routerLink="/public/home" routerLinkActive="active">{{ 'PUBLIC-NAV.Home' | translate }}</a>
      <a routerLink="/public/about" routerLinkActive="active">{{ 'PUBLIC-NAV.About' | translate }}</a>
      <a routerLink="/public/contact-us" routerLinkActive="active">{{ 'PUBLIC-NAV.Contact' | translate }}</a>
    </nav>

    <div class="public-nav-actions">
      <app-language-selector class="lang-select"></app-language-selector>
      <a mat-stroked-button class="public-sign-in" routerLink="/auth/login">Sign in</a>
    </div>
  </header>

  <main class="page-host">
    <router-outlet></router-outlet>
  </main>

  <footer class="public-footer">
    <a class="footer-brand" routerLink="/public/home">808 Music</a>
    <p>{{ 'PUBLIC-NAV.Copyright' | translate }}</p>
    <div class="footer-links">
      <a routerLink="/public/about">{{ 'PUBLIC-NAV.About' | translate }}</a>
      <a routerLink="/public/contact-us">{{ 'PUBLIC-NAV.Contact' | translate }}</a>
    </div>
  </footer>
</div>
